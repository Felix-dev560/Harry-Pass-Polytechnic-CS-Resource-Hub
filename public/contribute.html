<main><div class="wrap">
  <div class="page-head">
    <h1>Share an old paper or handout</h1>
    <p>Take clear photos of a question paper or handout you have. You can send up to 20 photos at once. The admin downloads them and adds them to the course.</p>
  </div>

  <form class="glass form-glass" id="contribute-form" novalidate>
    <div class="field">
      <label class="dropzone" id="dropzone" for="image">
        <span class="dropzone-ico"><svg viewBox="0 0 24 24" aria-hidden="true" class="icon"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></span>
        <strong>Take or choose photos</strong>
        <span class="hint">Up to 20 at once, for example every page of one paper. JPEG or PNG</span>
        <input id="image" name="image" type="file" accept="image/jpeg,image/png,image/webp" multiple>
      </label>
      <div id="preview" hidden>
        <p class="preview-count" id="preview-count"></p>
        <ul class="preview-list" id="preview-list"></ul>
      </div>
    </div>

    <div class="form-row two">
      <div class="field">
        <div class="control">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="icon field-icon"><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></svg>
          <input id="course_code" name="course_code" type="text" placeholder=" " maxlength="10" pattern="[A-Za-z]{2,5}[ \-]?[0-9]{3}" autocomplete="off" autocapitalize="characters" required>
          <label for="course_code">Course code, e.g. COM 111</label>
        </div>
      </div>
      <div class="field">
        <div class="control">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="icon field-icon"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
          <input id="year" name="year" type="number" min="2021" placeholder=" " inputmode="numeric" required>
          <label for="year">Year</label>
        </div>
      </div>
    </div>
    <div class="field">
      <div class="control">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icon field-icon"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
        <select id="semester" name="semester" required>
          <option value="" disabled selected>Choose semester</option>
          <option value="First">First semester</option>
          <option value="Second">Second semester</option>
        </select>
        <label for="semester">Semester</label>
      </div>
    </div>
    <div class="field">
      <div class="control">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icon field-icon"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <input id="course_title" name="course_title" type="text" placeholder=" " maxlength="150" autocomplete="off">
        <label for="course_title">Course title </label>
      </div>
    </div>

    <div class="trap" aria-hidden="true"><label for="website">Leave this empty</label><input id="website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
    <button class="pill-btn primary btn-block" type="submit">Send photos</button>
    <p id="form-status" class="status" role="status"></p>
  </form>
</div></main>
