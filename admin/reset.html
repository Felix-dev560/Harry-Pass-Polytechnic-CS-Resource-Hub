<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reset Admin Password | Harry Pass CS Hub</title>
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<script src="../js/theme.js"></script>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-body">

<nav class="auth-top-nav" aria-label="Page controls">
  <button type="button" class="icon-btn" data-theme-toggle data-icon-only aria-label="Switch theme">
    <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
  </button>
</nav>

<main class="auth-main">
  <section class="auth-card auth-single" id="auth-card" data-mode="login">
    <div class="auth-viewport">
      <div class="auth-track">
        <div class="auth-panel">
          <div class="panel-clip"><div class="panel-body">
            <header class="auth-head">
              <h1 class="auth-title">Reset password</h1>
              <p class="auth-sub">Enter your admin email and the setup key from the server settings (ADMIN_SETUP_KEY).</p>
            </header>

            <form id="reset-form" novalidate>
              <div class="field">
                <div class="control">
                  <svg class="icon field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                  <input id="reset-email" name="email" type="email" placeholder=" " autocomplete="email" autocapitalize="none" spellcheck="false" required>
                  <label for="reset-email">Email</label>
                </div>
              </div>
              <div class="field">
                <div class="control control-password">
                  <svg class="icon field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
                  <input id="reset-key" name="setup_key" type="password" placeholder=" " autocomplete="off" autocapitalize="none" spellcheck="false" required>
                  <label for="reset-key">Setup key</label>
                  <button type="button" class="toggle-password" aria-label="Show password" aria-pressed="false">
                    <svg class="icon icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="icon icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                  </button>
                </div>
              </div>
              <div class="field">
                <div class="control control-password">
                  <svg class="icon field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                  <input id="reset-password" name="password" type="password" placeholder=" " autocomplete="new-password" maxlength="128" required>
                  <label for="reset-password">New password</label>
                  <button type="button" class="toggle-password" aria-label="Show password" aria-pressed="false">
                    <svg class="icon icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="icon icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                  </button>
                </div>
              </div>
              <div class="field">
                <div class="control control-password">
                  <svg class="icon field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
                  <input id="reset-confirm" name="confirm_password" type="password" placeholder=" " autocomplete="new-password" maxlength="128" required>
                  <label for="reset-confirm">Confirm new password</label>
                  <button type="button" class="toggle-password" aria-label="Show password" aria-pressed="false">
                    <svg class="icon icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="icon icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                  </button>
                </div>
              </div>
              <button class="auth-submit" type="submit">
                <span>Reset password</span>
              </button>
              <p id="reset-status" class="status" role="status" aria-live="polite"></p>
              <p class="auth-foot"><a class="auth-link" href="index.html">Back to sign in</a></p>
            </form>
          </div></div>
        </div>
      </div>
    </div>
  </section>
</main>

<script type="module" src="reset.js"></script>
</body>
</html>
