<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin Sign In | Harry Pass CS Hub</title>
<meta name="color-scheme" content="light dark">
<script src="../js/theme.js"></script>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-body">

<nav class="auth-top-nav" aria-label="Page controls">
  <button type="button" class="icon-btn" data-theme-toggle data-icon-only aria-label="Switch theme">
    <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
  </button>
</nav>

<main class="auth-main">
  <section class="auth-card" id="auth-card" data-mode="login">

    <!-- Sliding pill tabs -->
    <div class="auth-tabs" id="auth-tabs" role="tablist" aria-label="Admin access" hidden>
      <span class="tab-indicator" aria-hidden="true"></span>
      <button type="button" class="tab-btn" id="tab-login" role="tab" aria-selected="true" aria-controls="login-panel" data-mode="login">Sign in</button>
      <button type="button" class="tab-btn" id="tab-register" role="tab" aria-selected="false" aria-controls="register-panel" data-mode="register" tabindex="-1">Register</button>
    </div>

    <div class="auth-viewport">
      <div class="auth-track">

        <!-- Sign in panel -->
        <div class="auth-panel panel-login" id="login-panel" role="tabpanel" aria-labelledby="tab-login">
          <div class="panel-clip"><div class="panel-body">
            <header class="auth-head">
              <h1 class="auth-title">Welcome back</h1>
            </header>

            <form id="login-form" novalidate>
              <div class="field">
                <div class="control">
                  <svg class="icon field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                  <input id="login-email" name="email" type="email" placeholder=" " autocomplete="email" autocapitalize="none" spellcheck="false" required>
                  <label for="login-email">Email</label>
                </div>
              </div>
              <div class="field">
                <div class="control control-password">
                  <svg class="icon field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                  <input id="login-password" name="password" type="password" placeholder=" " autocomplete="current-password" required>
                  <label for="login-password">Password</label>
                  <button type="button" class="toggle-password" aria-label="Show password" aria-pressed="false">
                    <svg class="icon icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="icon icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                  </button>
                </div>
              </div>
              <div class="auth-options">
                <label class="check"><input type="checkbox" name="remember" value="1"> Keep me signed in</label>
              </div>
              <button class="auth-submit" type="submit">
                <span>Sign in</span>
              </button>
              <p id="login-status" class="status" role="status" aria-live="polite"></p>
            </form>
          </div></div>
        </div>

        <!-- Register panel -->
        <div class="auth-panel panel-register" id="register-panel" role="tabpanel" aria-labelledby="tab-register" inert hidden>
          <div class="panel-clip"><div class="panel-body">
            <header class="auth-head">
              <h1 class="auth-title">Create admin account</h1>
            </header>

            <form id="register-form" novalidate>
              <div class="auth-row two">
                <div class="field">
                  <div class="control">
                    <svg class="icon field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <input id="reg-firstname" name="first_name" type="text" placeholder=" " autocomplete="given-name" maxlength="50" required>
                    <label for="reg-firstname">First name</label>
                  </div>
                </div>
                <div class="field">
                  <div class="control">
                    <svg class="icon field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <input id="reg-lastname" name="last_name" type="text" placeholder=" " autocomplete="family-name" maxlength="50" required>
                    <label for="reg-lastname">Last name</label>
                  </div>
                </div>
              </div>
              <div class="field">
                <div class="control">
                  <svg class="icon field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                  <input id="reg-email" name="email" type="email" placeholder=" " autocomplete="email" autocapitalize="none" spellcheck="false" required>
                  <label for="reg-email">Email</label>
                </div>
              </div>
              <div class="auth-row two">
                <div class="field">
                  <div class="control control-password">
                    <svg class="icon field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <input id="reg-password" name="password" type="password" placeholder=" " autocomplete="new-password" required>
                    <label for="reg-password">Password</label>
                    <button type="button" class="toggle-password" aria-label="Show password" aria-pressed="false">
                      <svg class="icon icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                      <svg class="icon icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                    </button>
                  </div>
                </div>
                <div class="field">
                  <div class="control control-password">
                    <svg class="icon field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
                    <input id="reg-confirm" name="confirm_password" type="password" placeholder=" " autocomplete="new-password" required>
                    <label for="reg-confirm">Confirm</label>
                    <button type="button" class="toggle-password" aria-label="Show password" aria-pressed="false">
                      <svg class="icon icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                      <svg class="icon icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                    </button>
                  </div>
                </div>
              </div>
              <button class="auth-submit" type="submit">
                <span>Create account</span>
                <svg class="icon submit-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
              </button>
              <p id="register-status" class="status" role="status" aria-live="polite"></p>
            </form>
          </div></div>
        </div>

      </div>
    </div>
  </section>
</main>

<script type="module" src="admin-auth.js"></script>
</body>
</html>
