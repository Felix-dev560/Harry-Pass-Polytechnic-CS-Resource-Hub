<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard | Harry Pass CS Hub</title>
<meta name="color-scheme" content="light dark">
<script src="../js/theme.js"></script>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/student.css">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<body class="student dash">

<div class="float-menu">
  <div class="menu-wrap">
    <button type="button" class="icon-btn" id="menu-btn" aria-label="Open menu" aria-haspopup="menu" aria-expanded="false" aria-controls="menu"><i data-icon="more-vertical"></i></button>
    <div class="menu" id="menu" role="menu" hidden>
      <button type="button" class="menu-item" role="menuitem" data-view="courses"><i data-icon="upload"></i><span>Courses and uploads</span></button>
      <button type="button" class="menu-item" role="menuitem" data-view="posts"><i data-icon="folder"></i><span>Posts</span></button>
      <button type="button" class="menu-item" role="menuitem" data-view="submissions"><i data-icon="image"></i><span>Student photos</span><span class="badge" id="queue-count" hidden></span></button>
      <button type="button" class="menu-item" role="menuitem" data-view="password"><i data-icon="lock"></i><span>Password</span></button>
      <button type="button" class="menu-item" role="menuitem" data-theme-toggle><i data-icon="moon" class="icon-moon"></i><i data-icon="sun" class="icon-sun"></i><span data-theme-label>Dark mode</span></button>
      <button type="button" class="menu-item" role="menuitem" id="logout"><i data-icon="log-out"></i><span>Sign out</span></button>
    </div>
  </div>
</div>

<main><div class="wrap stack">

  <!-- Course and upload, one form -->
  <section id="courses" aria-labelledby="courses-title">
    <h2 id="courses-title">Courses</h2>
    <form class="form-card glass" id="course-form" novalidate>
      <div class="edit-banner" id="edit-banner" role="status" hidden>
        <i data-icon="pencil"></i>
        <div><strong id="edit-banner-title"></strong><small id="edit-banner-sub"></small></div>
      </div>
      <input type="hidden" name="id">
      <div class="row two">
        <div class="field"><label for="c-level">Level</label>
          <select id="c-level" name="level_id" required>
            <option value="1">ND 1</option><option value="2">ND 2</option><option value="3">HND 1</option><option value="4">HND 2</option>
          </select></div>
        <div class="field"><label for="c-semester">Semester</label>
          <select id="c-semester" name="semester" required><option>First</option><option>Second</option></select></div>
      </div>
      <div class="row two">
        <div class="field"><label for="c-code">Course code</label><input id="c-code" name="course_code" type="text" placeholder="COM 111" maxlength="10" required></div>
        <div class="field"><label for="m-year">Year</label><select id="m-year" name="year"></select><small class="field-warn" id="m-year-warn" role="alert" hidden></small></div>
      </div>
      <div class="field"><label for="c-title">Course title</label><input id="c-title" name="course_title" type="text" maxlength="150" required></div>
      <div class="field">
        <label for="m-question-file">Past question</label>
        <div class="current" id="m-question-current"></div>
        <div class="filepick">
          <input id="m-question-file" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx">
          <span class="pill-btn sm filepick-btn" aria-hidden="true"><i data-icon="upload"></i>Choose file</span>
          <span class="filepick-text"><span class="filepick-name" id="m-question-name"></span><small class="filepick-hint" id="m-question-hint"></small></span>
          <button type="button" class="filepick-clear" id="m-question-clear" aria-label="Remove the chosen past question file" hidden><i data-icon="x"></i></button>
        </div>
      </div>
      <div class="field">
        <label for="m-handout-file">Handout</label>
        <div class="current" id="m-handout-current"></div>
        <div class="filepick">
          <input id="m-handout-file" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx">
          <span class="pill-btn sm filepick-btn" aria-hidden="true"><i data-icon="upload"></i>Choose file</span>
          <span class="filepick-text"><span class="filepick-name" id="m-handout-name"></span><small class="filepick-hint" id="m-handout-hint"></small></span>
          <button type="button" class="filepick-clear" id="m-handout-clear" aria-label="Remove the chosen handout file" hidden><i data-icon="x"></i></button>
        </div>
      </div>
      <div class="field"><label for="m-note">Note for anything missing</label><input id="m-note" type="text" maxlength="200" placeholder="Pending"></div>
      <div class="form-buttons">
        <button class="pill-btn primary" type="submit" id="course-save">Save</button>
        <button class="pill-btn" type="button" id="course-cancel" hidden>Cancel edit</button>
      </div>
    </form>
  </section>

  <!-- Posts library -->
  <section id="posts" hidden aria-labelledby="posts-title">
    <h2 id="posts-title">Posts</h2>
    <div class="searchbox">
      <i data-icon="search" class="field-icon"></i>
      <input id="lib-filter" type="search" placeholder=" course by code or title" aria-label="Find a course" autocomplete="off" spellcheck="false">
      <button type="button" class="clear-btn" id="lib-filter-clear" aria-label="Clear search" hidden><i data-icon="x"></i></button>
    </div>
    <div id="library" class="library"></div>
    <div class="empty-state glass" id="lib-empty" hidden>
      <span class="tile-ico"><i data-icon="search"></i></span>
      <p><strong>No course matches that search.</strong></p>
    </div>
  </section>

  <!-- Student photos -->
  <section id="submissions" hidden aria-labelledby="submissions-title">
    <h2 id="submissions-title">Student photos</h2>
    <p id="queue-status" class="status" role="status"></p>
    <div id="queue"></div>
  </section>

  <!-- Password -->
  <section id="password" hidden aria-labelledby="password-title">
    <h2 id="password-title">Password</h2>
    <form class="form-card glass" id="password-form" novalidate>
      <div class="field">
        <div class="control control-password">
          <svg class="icon field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input id="p-new" type="password" placeholder=" " autocomplete="new-password" maxlength="128" required>
          <label for="p-new">New password</label>
          <button type="button" class="toggle-password" aria-label="Show password" aria-pressed="false">
            <svg class="icon icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
          </button>
        </div>
      </div>
      <div class="field">
        <div class="control control-password">
          <svg class="icon field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
          <input id="p-confirm" type="password" placeholder=" " autocomplete="new-password" maxlength="128" required>
          <label for="p-confirm">Confirm new password</label>
          <button type="button" class="toggle-password" aria-label="Show password" aria-pressed="false">
            <svg class="icon icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
          </button>
        </div>
      </div>
      <div class="form-buttons">
        <button class="pill-btn primary" type="submit" id="password-save">Save</button>
      </div>
    </form>
  </section>

</div></main>
<script type="module" src="dashboard.js"></script>
<script type="module" src="../js/notify.js"></script>
</body></html>
